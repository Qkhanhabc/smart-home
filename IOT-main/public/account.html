<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài khoản | SmartHome</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><style>.account-card{border:0;border-radius:16px;box-shadow:0 5px 18px #1c315214}.avatar{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:#eaf2ff;color:#1769aa;font-size:1.4rem}</style></head>
<body><aside class="sidebar bg-dark text-white"><div class="logo mb-4"><i class="fa-solid fa-gauge-high me-2"></i> Smart Home</div><a href="index.html"><i class="fa-solid fa-tachometer-alt me-2"></i> Dashboard</a><a href="airconditioner.html"><i class="fa-solid fa-snowflake me-2"></i> Điều hòa</a><a href="automation.html"><i class="fa-solid fa-wand-magic-sparkles me-2"></i> Tự động hóa</a><a href="alerts.html"><i class="fa-solid fa-envelope me-2"></i> Cảnh báo email</a><a href="datasensor.html"><i class="fa-solid fa-database me-2"></i> Dữ liệu cảm biến</a><a href="history.html"><i class="fa-solid fa-history me-2"></i> Lịch sử</a><a href="stats.html"><i class="fa-solid fa-chart-pie me-2"></i> Thống kê</a><a href="profile.html"><i class="fa-solid fa-microchip me-2"></i> Thông tin hệ thống</a></aside>
<main class="main-content p-4"><header class="mb-4"><h1 class="h2 mb-1">Tài khoản</h1><p class="text-secondary mb-0">Quản lý thông tin cá nhân và bảo mật đăng nhập.</p></header><div class="row g-4"><div class="col-xl-7"><section class="card account-card"><div class="card-body p-4"><div class="d-flex align-items-center gap-3 mb-4"><div class="avatar"><i class="fa-solid fa-user"></i></div><div><h2 id="greeting" class="h5 mb-1">Thông tin cá nhân</h2><div class="text-secondary small">Thành viên từ <span id="createdAt">—</span></div></div></div><form id="profileForm"><label class="form-label" for="username">Tên đăng nhập</label><input id="username" class="form-control mb-3" disabled><label class="form-label" for="fullName">Họ và tên</label><input id="fullName" class="form-control mb-3" required minlength="2" maxlength="80"><label class="form-label" for="email">Email</label><input id="email" class="form-control mb-3" type="email" required maxlength="254"><div id="profileMessage" class="small mb-3" role="status"></div><button class="btn btn-primary">Lưu thông tin</button></form></div></section></div><div class="col-xl-5"><section class="card account-card"><div class="card-body p-4"><h2 class="h5 mb-1">Đổi mật khẩu</h2><p class="text-secondary small mb-4">Dùng mật khẩu hiện tại để xác nhận thay đổi.</p><form id="passwordForm"><label class="form-label" for="currentPassword">Mật khẩu hiện tại</label><input id="currentPassword" class="form-control mb-3" type="password" autocomplete="current-password" required><label class="form-label" for="newPassword">Mật khẩu mới</label><input id="newPassword" class="form-control mb-3" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label><input id="confirmPassword" class="form-control mb-3" type="password" minlength="10" maxlength="128" autocomplete="new-password" required><div id="passwordMessage" class="small mb-3" role="status"></div><button class="btn btn-outline-primary">Cập nhật mật khẩu</button></form></div></section></div></div></main>
<script src="/js/auth-ui.js"></script><script>
const message=(id,text,ok=false)=>{const el=document.querySelector(id);el.textContent=text;el.className=`small mb-3 ${ok?'text-success':'text-danger'}`};
async function loadAccount(){const r=await fetch('/api/auth/me');if(!r.ok){location.replace('/login.html');return}const u=await r.json();document.querySelector('#username').value=u.username;document.querySelector('#fullName').value=u.fullName;document.querySelector('#email').value=u.email;document.querySelector('#greeting').textContent=u.fullName;document.querySelector('#createdAt').textContent=new Date(u.createdAt).toLocaleDateString('vi-VN')}
document.querySelector('#profileForm').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:document.querySelector('#fullName').value,email:document.querySelector('#email').value})});const d=await r.json().catch(()=>({}));if(!r.ok)return message('#profileMessage',d.message||'Không lưu được thông tin.');document.querySelector('#greeting').textContent=d.fullName;message('#profileMessage','Đã cập nhật thông tin tài khoản.',true)});
document.querySelector('#passwordForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget;if(f.newPassword.value!==f.confirmPassword.value)return message('#passwordMessage','Mật khẩu xác nhận không khớp.');const r=await fetch('/api/auth/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:f.currentPassword.value,newPassword:f.newPassword.value,confirmPassword:f.confirmPassword.value})});const d=await r.json().catch(()=>({}));if(!r.ok)return message('#passwordMessage',d.message||'Không đổi được mật khẩu.');f.reset();message('#passwordMessage','Đã đổi mật khẩu thành công.',true)});
loadAccount();
</script></body></html>
