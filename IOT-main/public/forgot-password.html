<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quên mật khẩu | SmartHome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;display:grid;place-items:center;background:#f2f5f9}.card{width:min(440px,94vw);border:0;box-shadow:0 12px 40px #172b4d18}</style>
</head>
<body><main class="card p-4">
  <h1 class="h3 mb-1">Quên mật khẩu</h1>
  <p class="text-secondary mb-4">Nhập email đã đăng ký. Nếu tài khoản tồn tại và email được cấu hình, hướng dẫn sẽ được gửi đến bạn.</p>
  <form id="forgotForm">
    <label class="form-label" for="email">Email tài khoản</label>
    <input class="form-control mb-3" id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
    <div id="message" class="small mb-3" role="status" aria-live="polite"></div>
    <button id="submitButton" class="btn btn-primary w-100">Gửi hướng dẫn</button>
  </form>
  <p class="small mt-3 mb-0"><a href="/login.html">Quay lại đăng nhập</a></p>
</main>
<script>
const form=document.querySelector('#forgotForm');const message=document.querySelector('#message');const button=document.querySelector('#submitButton');
form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;message.textContent='';message.className='small mb-3';button.disabled=true;button.textContent='Đang gửi…';try{const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Không gửi được yêu cầu.');message.textContent=d.message;message.classList.add('text-success');form.reset()}catch(error){message.textContent=error.message||'Không kết nối được máy chủ.';message.classList.add('text-danger')}finally{button.disabled=false;button.textContent='Gửi hướng dẫn'}});
</script></body>
</html>
