<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đặt lại mật khẩu | SmartHome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;display:grid;place-items:center;background:#f2f5f9}.card{width:min(440px,94vw);border:0;box-shadow:0 12px 40px #172b4d18}</style>
</head>
<body><main class="card p-4">
  <h1 class="h3 mb-1">Tạo mật khẩu mới</h1>
  <p class="text-secondary mb-4">Mật khẩu cần từ 10 đến 128 ký tự. Liên kết đặt lại chỉ dùng một lần và có hạn 15 phút.</p>
  <form id="resetForm">
    <label class="form-label" for="password">Mật khẩu mới</label>
    <input class="form-control mb-3" id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
    <input class="form-control mb-3" id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
    <div id="message" class="small mb-3" role="status" aria-live="polite"></div>
    <button id="submitButton" class="btn btn-primary w-100">Đặt lại mật khẩu</button>
  </form>
  <p class="small mt-3 mb-0"><a href="/login.html">Quay lại đăng nhập</a></p>
</main>
<script>
const form=document.querySelector('#resetForm');const message=document.querySelector('#message');const button=document.querySelector('#submitButton');const token=new URLSearchParams(location.search).get('token')||'';if(token)window.history.replaceState({},'',location.pathname);
if(!token){message.textContent='Liên kết đặt lại không hợp lệ. Hãy yêu cầu liên kết mới.';message.classList.add('text-danger');button.disabled=true}
form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;if(form.password.value!==form.confirmPassword.value){message.textContent='Mật khẩu xác nhận không khớp.';message.className='small mb-3 text-danger';form.confirmPassword.focus();return}message.textContent='';button.disabled=true;button.textContent='Đang cập nhật…';try{const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:form.password.value,confirmPassword:form.confirmPassword.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Không đặt lại được mật khẩu.');message.textContent=d.message;message.className='small mb-3 text-success';form.reset();button.textContent='Đã cập nhật';return}catch(error){message.textContent=error.message||'Không kết nối được máy chủ.';message.className='small mb-3 text-danger'}finally{if(button.textContent!=='Đã cập nhật'){button.disabled=false;button.textContent='Đặt lại mật khẩu'}}});
</script></body>
</html>
