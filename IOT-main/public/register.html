<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tạo tài khoản | SmartHome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef4ff,#f7f9fc)}.card{width:min(500px,94vw);border:0;border-radius:18px;box-shadow:0 18px 55px #172b4d18}.form-control{padding:.7rem .85rem}</style>
</head>
<body><main class="card p-4 p-md-5">
  <div class="mb-4"><span class="badge text-bg-primary mb-3">SMARTHOME</span><h1 class="h3 mb-1">Tạo tài khoản</h1><p class="text-secondary mb-0">Thông tin của bạn giúp cá nhân hóa trang điều khiển.</p></div>
  <form id="authForm" novalidate>
    <label class="form-label" for="fullName">Họ và tên</label><input class="form-control mb-3" id="fullName" name="fullName" autocomplete="name" required minlength="2" maxlength="80" placeholder="Nguyễn Văn An">
    <label class="form-label" for="email">Email</label><input class="form-control mb-3" id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="ban@example.com">
    <label class="form-label" for="username">Tên đăng nhập</label><input class="form-control mb-3" id="username" name="username" autocomplete="username" required minlength="3" maxlength="32" pattern="[a-zA-Z0-9_.-]+" placeholder="3–32 ký tự: chữ, số, ., _, -">
    <label class="form-label" for="password">Mật khẩu</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128" aria-describedby="passwordHelp"><div id="passwordHelp" class="form-text mb-3">Ít nhất 10 ký tự. Mật khẩu được băm trước khi lưu.</div>
    <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label><input class="form-control mb-3" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="10" maxlength="128">
    <div id="message" class="text-danger small mb-3" role="alert"></div><button id="submitButton" class="btn btn-primary w-100 py-2">Tạo tài khoản</button>
  </form>
  <p class="small text-center mt-4 mb-0">Đã có tài khoản? <a href="/login.html">Đăng nhập</a></p>
</main>
<script>
const form=document.querySelector('#authForm');const message=document.querySelector('#message');
form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';if(!form.reportValidity())return;const f=new FormData(form);if(f.get('password')!==f.get('confirmPassword')){message.textContent='Mật khẩu xác nhận không khớp.';document.querySelector('#confirmPassword').focus();return}const button=document.querySelector('#submitButton');button.disabled=true;button.textContent='Đang tạo tài khoản…';try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:f.get('fullName'),email:f.get('email'),username:f.get('username'),password:f.get('password'),confirmPassword:f.get('confirmPassword')})});const d=await r.json().catch(()=>({}));if(!r.ok){message.textContent=d.message||'Đăng ký thất bại';return}location.replace('/index.html')}catch{message.textContent='Không kết nối được máy chủ.'}finally{button.disabled=false;button.textContent='Tạo tài khoản'}});
</script></body></html>
