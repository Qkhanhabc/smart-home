<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập | SmartHome</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{min-height:100vh;display:grid;place-items:center;background:#f2f5f9}.card{width:min(420px,94vw);border:0;box-shadow:0 12px 40px #172b4d18}</style></head>
<body><main class="card p-4"><h1 class="h3 mb-1">SmartHome</h1><p class="text-secondary mb-4">Đăng nhập để điều khiển hệ thống</p><form id="authForm"><label class="form-label" for="username">Tên đăng nhập</label><input class="form-control mb-3" id="username" name="username" autocomplete="username" required minlength="3"><label class="form-label" for="password">Mật khẩu</label><input class="form-control mb-2" id="password" name="password" type="password" autocomplete="current-password" required><div class="text-end small mb-3"><a href="/forgot-password.html">Quên mật khẩu?</a></div><div id="message" class="text-danger small mb-3" role="alert"></div><button class="btn btn-primary w-100">Đăng nhập</button></form><p class="small mt-3 mb-0">Chưa có tài khoản? <a href="/register.html">Đăng ký</a></p></main><script>
document.querySelector('#authForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})});const d=await r.json().catch(()=>({}));if(!r.ok){document.querySelector('#message').textContent=d.message||'Đăng nhập thất bại';return}location.replace('/index.html')});
</script></body></html>
