<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/data-pages.css">
    <style>
        .btn-group .btn.active-filter {
            background-color: #0d6efd;
            color: white;
            border-color: #0d6efd;
        }
        .btn-group .btn.active-filter:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="sidebar bg-dark text-white">
        <div class="logo mb-4"><i class="fa-solid fa-gauge-high me-2"></i> History</div>
        <a href="index.html"><i class="fa-solid fa-tachometer-alt me-2"></i> Dashboard</a>
        <a href="airconditioner.html"><i class="fa-solid fa-snowflake me-2"></i> Điều hòa</a>
        <a href="automation.html"><i class="fa-solid fa-wand-magic-sparkles me-2"></i> Tự động hóa</a>
        <a href="alerts.html"><i class="fa-solid fa-envelope me-2"></i> Cảnh báo email</a>
        <a href="datasensor.html"><i class="fa-solid fa-database me-2"></i> Data Sensor</a>
        <a href="history.html" class="active"><i class="fa-solid fa-history me-2"></i> History</a>
        <a href="stats.html"><i class="fa-solid fa-chart-pie me-2"></i> Thống kê</a>
        <a href="profile.html"><i class="fa-solid fa-microchip me-2"></i> Thông tin hệ thống</a>
    </div>

    <div class="main-content p-3">
        <h1 class="mb-3">Lịch sử Điều khiển</h1>
        <div class="row data-row">
            <div class="col-lg-3">
                <div class="card full-height-card filter-card">
                    <div class="card-header"><i class="fas fa-filter me-2"></i> Bộ lọc</div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Lọc nhanh thiết bị</label>
                            <div class="btn-group w-100" id="deviceFilterGroup">
                                <button class="btn btn-outline-primary" data-device="quạt">Quạt</button>
                                <button class="btn btn-outline-info" data-device="điều hòa">Điều hòa</button>
                                <button class="btn btn-outline-warning" data-device="đèn">Đèn</button>
                                <button class="btn btn-outline-secondary active-filter" data-device="">Tất cả</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Lọc nhanh trạng thái</label>
                            <div class="btn-group w-100" id="statusFilterGroup">
                                <button class="btn btn-outline-success" data-status="on">ON</button>
                                <button class="btn btn-outline-danger" data-status="off">OFF</button>
                                <button class="btn btn-outline-secondary active-filter" data-status="">Tất cả</button>
                            </div>
                        </div>
                        <hr>
                        <h6 class="fw-bold">Lọc chuyên sâu</h6>
                        <div class="mb-3">
                            <label for="filterType" class="form-label">Tìm kiếm theo</label>
                            <select class="form-select" id="filterType">
                                <option value="all">Tất cả</option>
                                <option value="time">Thời Gian (dd/mm/yy hh:mm)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="filterValue" class="form-label">Nhập giá trị</label>
                            <input type="text" class="form-control" id="filterValue" placeholder="Nhập giá trị lọc...">
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-primary flex-grow-1" id="submitFilters">Áp dụng</button>
                            <button class="btn btn-secondary flex-grow-1" id="resetFilters">Đặt lại</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-9">
                <div class="card full-height-card table-card">
                    <div class="card-header"><i class="fas fa-table me-2"></i> Bảng dữ liệu</div>
                    <div class="card-body">
                        <table class="table table-striped table-hover" id="historyTable" style="width:100%">
                            <thead>
                                <tr>
                                    <th>#</th><th>Thiết bị</th><th>Trạng thái</th><th>Thời Gian</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script>
        function formatDate(dStr) {
            if (!dStr) return '';
            const d = new Date(dStr);
            const pad = (n) => n < 10 ? '0' + n : n;
            return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        $(document).ready(function () {
            let currentStatusFilter = '';
            let currentDeviceFilter = '';

            const table = $('#historyTable').DataTable({
                scrollY: "100%", scrollCollapse: true, paging: true,
                columns: [
                    { data: 'id', orderable: false }, 
                    { data: 'device', name: 'device' },
                    { data: 'status', name: 'status' }, 
                    { data: 'time', name: 'time' }
                ],
                serverSide: true, processing: true, searching: false,
                language: { url: "https://cdn.datatables.net/plug-ins/1.13.4/i18n/vi.json" },
                ajax: function (data, callback, settings) {
                    let filters = { 
                        status: currentStatusFilter,
                        device: currentDeviceFilter
                    };
                    const filterType = $('#filterType').val();
                    const filterValue = $('#filterValue').val().trim(); // <<< SỬA LỖI Ở ĐÂY

                    if (filterValue) {
                        if (filterType === 'all') {
                            filters.globalSearch = filterValue;
                        } else {
                           filters[filterType] = filterValue;
                        }
                    }
                    
                    const order = data.order.map(o => ({ dir: o.dir, column: data.columns[o.column].name }));
                    $.ajax({
                        url: `/api/action?page=${Math.ceil(data.start / data.length) + 1}&limit=${data.length}&order=${JSON.stringify(order)}`,
                        type: 'GET', data: filters,
                        success: function (response) {
                             callback({
                                draw: data.draw,
                                recordsTotal: response.totalCount,
                                recordsFiltered: response.filteredCount,
                                data: response.data.map((item, index) => ({
                                    ...item,
                                    id: index + 1 + data.start,
                                    time: formatDate(item.time)
                                }))
                            });
                        }
                    });
                }
            });

            $('#statusFilterGroup .btn').on('click', function() {
                $('#statusFilterGroup .btn').removeClass('active-filter');
                $(this).addClass('active-filter');
                currentStatusFilter = $(this).data('status');
                table.draw();
            });

            $('#deviceFilterGroup .btn').on('click', function() {
                $('#deviceFilterGroup .btn').removeClass('active-filter');
                $(this).addClass('active-filter');
                currentDeviceFilter = $(this).data('device');
                table.draw();
            });

            $('#submitFilters').on('click', () => table.draw());
            
            $('#resetFilters').on('click', () => { 
                $('#filterType').val('all'); 
                $('#filterValue').val(''); 
                
                $('#statusFilterGroup .btn').removeClass('active-filter');
                $('#statusFilterGroup .btn[data-status=""]').addClass('active-filter');
                currentStatusFilter = '';

                $('#deviceFilterGroup .btn').removeClass('active-filter');
                $('#deviceFilterGroup .btn[data-device=""]').addClass('active-filter');
                currentDeviceFilter = '';
                
                table.draw(); 
            });
        });
    </script>
  <script src="/js/auth-ui.js"></script>
</body>
</html>
